[package]
name = "suspend_shim"
version = "0.1.0"
edition = "2024"
description = "Launches a game under the real launcher as its suspended parent process"

[[bin]]
name = "suspend_start"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
